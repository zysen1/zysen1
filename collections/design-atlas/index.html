<script id="data" type="application/json">{"title":"设计审美参考站","source_post":"https://x.com/EianLu/status/2121219503988113557","source_article":"https://x.com/i/article/2121110864367661056","source_author":"EianLu","source_title":"100 个提升审美的设计网站大赏","updated":"2026-11-27","resources":[{"id":1,"collection":"原帖","category":"大赛与奖项","name":"Pwnisher 3D 渲染挑战赛","url":"https://www.youtube.com/@pwnisher","try_it":"挑同一届挑战的三个投稿，暂停在角色落脚的同一帧，比较空间尺度、主光方向和视线落点。"},{"id":2,"collection":"原帖","category":"大赛与奖项","name":"Awwwards","url":"https://www.awwwards.com/","try_it":"点开一件获奖网站，再进真实站点。用手机和电脑各看一遍首屏，记下窄屏时被优先保留的信息。"},{"id":3,"collection":"原帖","category":"大赛与奖项","name":"CSS Design Awards","url":"https://www.cssdesignawards.com/","try_it":"找一个获奖首页，把首屏缩成缩略图，检查最先认出的究竟是品牌、标题还是行动按钮。"},{"id":4,"collection":"原帖","category":"大赛与奖项","name":"The FWA","url":"https://thefwa.com/","try_it":"打开一个互动获奖项目，记录从加载结束到第一次主动操作之间，画面怎样暗示“可以动手”。"},{"id":5,"collection":"原帖","category":"大赛与奖项","name":"The Motion Awards","url":"https://motionawards.com/","try_it":"从获奖片里抽开头、中段和收尾三帧，标出贯穿全片的字形、颜色或运动方向。"},{"id":6,"collection":"原帖","category":"大赛与奖项","name":"Apple Design Awards","url":"https://developer.apple.com/design/awards/","try_it":"读一款获奖应用的评语，再回到应用截图，指出哪个可见细节支撑了评委的判断。"},{"id":7,"collection":"原帖","category":"大赛与奖项","name":"D&AD","url":"https://www.dandad.org/","try_it":"从黄铅笔获奖档案找一个品牌项目，看同一识别元素怎样同时落到海报、包装和小屏幕上。"},{"id":8,"collection":"原帖","category":"大赛与奖项","name":"The One Show & ADC","url":"https://www.oneclub.org/","try_it":"同看一件广告的创意说明与最终画面，试着用一句话讲清创意；若讲不出，再看画面删去了什么。"},{"id":9,"collection":"原帖","category":"大赛与奖项","name":"Runway AI Film Festival","url":"https://aif.runwayml.com/","try_it":"进影展选一支 AI 短片，标记角色或场景跨镜头仍可辨认的线索，给自己的分镜定一条连续性规则。"},{"id":10,"collection":"原帖","category":"大赛与奖项","name":"Tokyo TDC","url":"https://tokyotypedirectorsclub.org/","try_it":"挑一张字体作品，分别遮住文字和背景，判断版面主要靠字形、字距还是空白撑起来。"},{"id":11,"collection":"原帖","category":"大赛与奖项","name":"Annecy 安纳西国际动画节","url":"https://www.annecyfestival.com/","try_it":" ":"补充","category":"前端与交互","name":"Rive","url":"https://rive.app/","try_it":"从交互式角色或按钮案例入手；分别触发悬停和按下，记录每一次输入对应的动画状态。"},{"id":102,"collection":"补充","category":"3D 与渲染","name":"Spline","url":"https://spline.design/","try_it":"打开浏览器中的 3D 产品场景，转动相机找轮廓最清楚的角度，用同一构图试两种材质。"},{"id":103,"collection":"补充","category":"前端与交互","name":"Theatre.js","url":"https://www.theatrejs.com/","try_it":"从蝴蝶飞行示例观察关键帧的位置与旋转；给自己的镜头加一个停顿，再检查速度曲线。"},{"id":104,"collection":"补充","category":"前端与交互","name":"Easings.net","url":"https://easings.net/","try_it":"并排试 easeOutCubic 和 easeOutBack。前者减速落定，后者越过终点再回来，给同一张卡片试出两种手感。"},{"id":105,"collection":"补充","category":"3D 与渲染","name":"Shader Park","url":"https://shaderpark.com/","try_it":"用 sphere 和 box 拼一块程序雕塑，分别试 union、blend，观察棱线什么时候变成圆滑过渡。"},{"id":106,"collection":"补充","category":"3D 与渲染","name":"ambientCG","url":"https://ambientcg.com/","try_it":"找一组石材的 PBR 贴图，在自己的材质球上开关法线与粗糙度，比较哪张图负责凹凸、哪张负责反光。"},{"id":107,"collection":"补充","category":"电影画面与镜头参考","name":"Timeline of Historical Colors in Photography and Film","url":"https://filmcolors.org/","try_it":"沿时间线打开 Tinting 和 Toning 的胶片样本，分别观察亮部与暗部如何着色，为复古调色挑一个具体工艺。"},{"id":108,"collection":"补充","category":"字体与配色","name":"Axis-Praxis","url":"https://www.axis-praxis.org/","try_it":"输入相同的英文标题，在支持宽度轴的可变字体上拖动字宽，录下标题从疏朗到紧凑的变化。"},{"id":109,"collection":"补充","category":"字体与配色","name":"Wakamai Fondue","url":"https://wakamaifondue.com/","try_it":"拖入自己的字体文件，检查支持的 OpenType 特性和可变轴，再决定标题能否启用替代字形。"},{"id":110,"collection":"补充","category":"字体与配色","name":"OKLCH Color Picker","url":"https://oklch.com/","try_it":"粘贴品牌色，固定色相和色度，只调整明度做一列色阶，再看哪些颜色超出了 sRGB。"},{"id":111,"collection":"补充","category":"字体与配色","name":"Huemint","url":"https://huemint.com/","try_it":"选品牌或网站场景，在模拟版面上比较生成的配色，挑出标题和背景分得最清的一组。"},{"id":112,"collection":"补充","category":"日常收集灵感","name":"The Public Domain Review","url":"https://publicdomainreview.org/","try_it":"从 Collections 找老地图、版画或早期影像，沿来源链接回到收藏机构，记录可引用的原件和权利标注。"}]}</script>
<script>
const catalog=JSON.parse(document.querySelector('#data').textContent), rows=catalog.resources;
const el=id=>document.getElementById(id), make=(tag,cls,txt)=>{const node=document.createElement(tag);if(cls)node.className=cls;if(txt!=null)node.textContent=txt;return node};
const counts=(key)=>rows.reduce((acc,row)=>(acc[row[key]]=(acc[row[key]]||0)+1,acc),{});
const categories=counts('category'),sources=counts('collection'),cats=Object.keys(categories);
const colors=['#c36949','#7275ad','#578072','#c56c64','#807c4f','#ae6954','#517b83','#9370a1','#866a52'];
const norm=s=>s.toLocaleLowerCase().normalize('NFKC').trim();
const alternatives={缓动:['easings','easeout','速度曲线'],动效:['动态设计','动画','缓动','easings'],立体:['3d','三维'],色彩:['配色','颜色','色阶'],海报:['海报','招贴'],排字:['排版','字体']};
const text=rows.map(r=>norm([r.name,r.category,r.try_it,new URL(r.url).hostname].join(' ')));
let category='',source='';const catButtons=new Map(),sourceButtons=new Map();
function makeButton(container,label,callback){const b=make('button','',label);b.type='button';b.addEventListener('click',callback);container.appendChild(b);return b}
function chooseCat(val){category=val;el('mobileCat').value=val;render()}
function reset(){el('search').value='';source='';chooseCat('');el('search').focus()}
for(const [key,label,count] of [['','全部分类',rows.length],...cats.map(c=>[c,c,categories[c]])]){
 const b=makeButton(el('cats'),'',()=>chooseCat(key));b.append(make('span','',label),make('span','',String(count)));catButtons.set(key,b);
 const opt=make('option','',label+' ('+count+')');opt.value=key;el('mobileCat').appendChild(opt)}
for(const [key,label] of [['','全部来源'],['原帖','原帖收录'],['补充','另行补充']]){
 const b=makeButton(el('sources'),label,()=>{source=key;render()});sourceButtons.set(key,b)}
el('source').href=catalog.source_post;el('original').textContent=sources['原帖'];el('additional').textContent=sources['补充'];el('updated').textContent='整理日期 '+catalog.updated.replaceAll('-','.');
el('search').addEventListener('input',render);el('mobileCat').addEventListener('change',e=>chooseCat(e.target.value));
function render(){
 for(const [key,b] of catButtons)b.setAttribute('aria-pressed',String(category===key));for(const [key,b] of sourceButtons)b.setAttribute('aria-pressed',String(source===key));
 const terms=norm(el('search').value).split(/\s+/).filter(Boolean);
 const matches=rows.filter((r,i)=>(!source||r.collection===source)&&(!category||r.category===category)&&terms.every(word=>[word,...(alternatives[word]||[])].some(k=>text[i].includes(k))));
 el('count').textContent=matches.length+' / '+rows.length+' 个站点';
 const frag=document.createDocumentFragment();
 for(const r of matches){const link=make('a','card');link.href=r.url;link.target='_blank';link.rel='noopener noreferrer';link.style.setProperty('--accent',colors[cats.indexOf(r.category)%colors.length]);const meta=make('div','meta'),visit=make('div','visit');meta.append(make('span','',r.category),make('span','idx',r.collection+' '+String(r.id).padStart(3,'0')));visit.append(make('span','domain',new URL(r.url).hostname.replace(/^www\./,'')),make('span','arrow','↗'));link.append(meta,make('h3','',r.name),make('p','tip',r.try_it),visit);frag.append(link)}
 if(!matches.length){const msg=make('div','empty');msg.append(make('strong','','没有找到符合条件的站点。'));makeButton(msg,'清除筛选',reset);frag.append(msg)}
 el('results').replaceChildren(frag)}
render();
</script></body></html>
