<script id="data" type="application/json">{"title":"设计审美参考站","source_post":"https://x.com/EianLu/status/2121219503988113557","source_article":"https://x.com/i/article/2121110864367661056","source_author":"EianLu","source_title":"100 个提升审美的设计网站大赏","updated":"2026-11-27","resources":[{"id":1,"collection":"原帖","category":"大赛与奖项","name":"Pwnisher 3D 渲染挑战赛","url":"https://www.youtube.com/@pwnisher","try_it":"挑同一届挑战的三个投稿，暂停在角色落脚的同一帧，比较空间尺度、主光方向和视线落点。"},{"id":2,"collection":"原帖","category":"大赛与奖项","name":"Awwwards","url":"https://www.awwwards.com/","try_it":"点开一件获奖网站，再进真实站点。用手机和电脑各看一遍首屏，记下窄屏时被优先保留的信息。"},{"id":3,"collection":"原帖","category":"大赛与奖项","name":"CSS Design Awards","url":"https://www.cssdesignawards.com/","try_it":"找一个获奖首页，把首屏缩成缩略图，检查最先认出的究竟是品牌、标题还是行动按钮。"},{"id":4,"collection":"原帖","category":"大赛与奖项","name":"The FWA","url":"https://thefwa.com/","try_it":"打开一个互动获奖项目，记录从加载结束到第一次主动操作之间，画面怎样暗示“可以动手”。"},{"id":5,"collection":"原帖","category":"大赛与奖项","name":"The Motion Awards","url":"https://motionawards.com/","try_it":"从获奖片里抽开头、中段和收尾三帧，标出贯穿全片的字形、颜色或运动方向。"},{"id":6,"collection":"原帖","category":"大赛与奖项","name":"Apple Design Awards","url":"https://developer.apple.com/design/awards/","try_it":"读一款获奖应用的评语，再回到应用截图，指出哪个可见细节支撑了评委的判断。"},{"id":7,"collection":"原帖","category":"大赛与奖项","name":"D&AD","url":"https://www.dandad.org/","try_it":"从黄铅笔获奖档案找一个品牌项目，看同一识别元素怎样同时落到海报、包装和小屏幕上。"},{"id":8,"collection":"原帖","category":"大赛与奖项","name":"The One Show & ADC","url":"https://www.oneclub.org/","try_it":"同看一件广告的创意说明与最终画面，试着用一句话讲清创意；若讲不出，再看画面删去了什么。"},{"id":9,"collection":"原帖","category":"大赛与奖项","name":"Runway AI Film Festival","url":"https://aif.runwayml.com/","try_it":"进影展选一支 AI 短片，标记角色或场景跨镜头仍可辨认的线索，给自己的分镜定一条连续性规则。"},{"id":10,"collection":"原帖","category":"大赛与奖项","name":"Tokyo TDC","url":"https://tokyotypedirectorsclub.org/","try_it":"挑一张字体作品，分别遮住文字和背景，判断版面主要靠字形、字距还是空白撑起来。"},{"id":11,"collection":"原帖","category":"大赛与奖项","name":"Annecy 安纳西国际动画节","url":"https://www.annecyfestival.com/","try_it":" <script id="ai-cases" type="application/json">{"1":["相同机位的三帧＋自己的场景草图","同机位三套场景分镜","同一届挑战里三张同机位截图，以及自己角色的运动方向、镜头轨迹。","为自己的角色写沙漠、车库、雪原三版分镜。叠看第一帧，三版的地平线和角色落点应一致。"],"2":["获奖站宽窄两张首屏＋产品文案","可缩放的双端首屏","一个获奖网站的桌面与手机首屏、自己的产品标题和主按钮文案。","生成自己的响应式首屏原型，分别在 390 和 1440 像素宽度检查标题、图片和按钮的位置。"],"3":["获奖站缩略图＋自己的旧首页","三种首页信息层级","获奖首页的缩略图和自己首页，圈出各自最先被看到的元素。","给自己的首页做标题优先、产品优先、按钮优先三个缩略稿，缩到 240 像素对比第一眼看见什么。"],"4":["互动项目首个可操作瞬间","不读说明也会动手的入口","项目加载结束到首次交互的一小段录屏，以及自己页面上的可操作对象。","为该对象做一个交互提示原型，例如轻晃一次暗示可拖动；第一次拖拽后提示应消失。"],"5":["获奖片头的开中尾三帧","同一视觉线索贯穿的片头","截获奖作品开、中、尾各一帧，写明贯穿三帧的颜色或形状，再附自己的片名。","做五格原创片头分镜，在每格标出这条线索从哪儿进、怎样变形、最后落到哪一个字上。"],"6":["苹果评语＋自己的任务流程","可点按的改版流程","一小段官方评语、一张对应界面，以及自己应用中用户最常做的动作。","重排这一个任务的操作流程，提供改版前后可点原型，统计完成任务分别要点几次。"],"7":["同一品牌三种介质的应用图","自己的跨介质视觉规范","获奖项目的包装、海报、手机端三图，标出重复出现的识别元素，再给自己的品牌素材。","为自有品牌设计同一识别元素的三种用法，各给一页样稿，缩小后仍能认出同一家。"],"8":["广告创意梗概＋产品事实","一件产品的三版广告提案","用自己的话概括获奖广告里“观众以为什么、最后发生什么”，附产品能证实的一项功能。","写三个十五秒广告提案。每版用一句画面交代误会，一句画面揭示产品作用。"],"9":["短片连续两镜＋自有角色设定","跨镜头一致的提示词组","从影展片单挑两个相邻镜头，记录让你认出角色的线索，再附自有角色设定。","为自己的三个镜头写独立生成提示词，共用衣领、道具和光源方向三项约束，外加逐镜核对表。"],"10":["字体海报的留白标注＋题名","同一片名三张字海报","一张字体作品，遮掉背景做第二张观察图，另给自有片名与允许的色数。","只用自有题名排三张海报，分别让字重、留白、字距成为主变量；三版使用同样画幅。"],"11":["动画预告的三张动作剪影","角色表演的关键姿态表","一组预告剪影的动作观察笔记，附自己角色的性格、体形和一句动作描述。","画出这个角色起步、加速、急停三张姿态草图，填黑轮廓后也应能识别三个动作。"],"12":["同工种获奖广告的高光时间点","产品出场的布光分镜","选摄影类案例，标注产品初次露出轮廓、局部高光、全貌的时间，再附自家产品照片。","生成三镜头拍摄表，每镜注明灯位、运镜和显露的产品特征，可直接按表试拍。"],"13":["动效拆解里的切点前后帧","自己的转场动作分镜","项目报道里的切点前后两帧，画出上一帧的运动方向，再给自己准备衔接的两镜。","为自己的两镜画三格转场方案，把过渡物的入画边、遮挡时刻和离画边标清楚。"],"14":["幕后分层图＋自己的原镜头","可交给后期的分层清单","取有权查看和使用的幕后分解笔记，写出前景、中景、背景的作用，附自己的素材缩略图。","把自有镜头拆成底板、遮挡、特效三类图层，逐层列素材、叠加先后与需要补拍的部分。"],"15":["片头母题＋原创片名与主题","片名出现前的伏笔分镜","从旁访或片头里记下一种重复母题，给自己的题材、片名和片长。","产出四格片头：先两次埋下线索，第三格汇聚，末格出片名；每格写一个可拍对象。"],"16":["切点时间码＋自录短视频","声音提前或延后两版剪法","关声、开声各看一次精选短片，只记一个声音先于画面的切点，附自己的两镜和环境声。","排出两条自有素材的剪辑时间线，一条声音提前、一条声音延后，标明相差多少帧。"],"17":["案例的情绪板和风格帧","自有项目从参考到成片的镜头表","一组经标注的项目过程页截图，说明色彩、材质、构图各参考哪一点，再附自己的产品资料。","给新片排一页情绪板、一张带注释的风格帧说明和对应镜头表，逐镜能找到所用参考。"],"18":["短片开场的信息揭示时间","能交代人物与冲突的开场","记录一支精选短片中观众首次明白人物、地点、麻烦的顺序，附自己的故事梗概。","写可拍的三十秒开场，标出这三个信息各在哪个画面传达，结尾留下一个具体疑问。"],"19":["导演的拍摄限制＋自家场地","有限场景也能拍的镜头表","导演访谈里的一项制作约束，附自己的场地平面图、演员数和可用器材。","为同一段情节设计受约束的拍法，逐镜标走位和机位，检查所有镜头能在给定场地完成。"],"20":["动作逐帧观察＋自有角色图","预备起跳落地的帧数表","把观察到的预备、腾空、落地帧数记下来，再给自己的角色造型与目标帧率。","生成角色跳跃的曝光表和关键姿态提示，每段有起止帧，最后可逐帧回放核对重量感。"],"21":["音乐录像切点＋自有音乐节拍","卡拍与延后半拍的双版本","记下一个 MV 中切镜落在哪一拍，给 AI 自有音轨的 BPM、四个重拍时间与镜头列表。","写两版十五秒剪辑表，其中一版在指定重拍后延半拍，标出能直接拖入时间线的秒点。"],"22":["产品小图标与放大动作＋自有图形","三状态动画助手","截 Oswell 在应用里的原尺寸和放大的笔触变化，附自有助手的原始图形。","设计自有助手的待机、思考、完成三个状态，各给起止姿势，缩到 32 像素还能区分。"],"23":["产品反光轨迹＋自己的产品照片","一道高光扫过产品的分镜","标出案例里一条反光经过产品的顺序，再给自己的产品正侧视图、材质和片长。","把反射路线移到自己的轮廓上，写三镜布光和运镜，并注明哪个时刻要显出棱边。"],"24":["三张兔子过程图＋自己的动作线稿","同姿势三种视觉语言","标上同一只兔子的耳朵、背部和脚落点，给 AI 看手绘、点阵、网格三张过程图，再附自有动作草图。","让自己的角色以同一姿势得到三张原创风格稿。叠放检查重心与落脚点是否吻合。"],"25":["快切前后运动箭头＋自有镜头","视线接得上的追逐段落","给两处高速切镜画出主体出画与入画的方向，附自己的追逐场景和人物站位。","写六镜追逐分镜，每次切换画一对方向箭头，连播时能持续跟住同一主体。"],"26":["圆片与方框的叠色帧＋产品轮廓","有厚度的材质转场","选《Equilibrium》一张半透明叠色帧和弧边特写，圈出亮边与重叠区，给自家产品剪影。","为产品设计远景、贴近弧边、显露叠层三镜，指定反光边缘和最后出现的形状。"],"27":["作品灰模与成图＋自己的场景","先能读懂轮廓的三层灰模","从带分解的项目记下近中远景与主轮廓，附自己场景的物件和机位。","给可执行 3D 脚本的 AI 生成灰模布局，输出灰模和简单照明两张同机位图，检查主体能否辨认。"],"28":["学生项目制作节点＋自己的初稿","针对作品集的补图清单","一份公开作品集的制作阶段目录，以及自己的概念图、线框图和最终渲染。","生成个人项目的展示顺序，为每幅图写它应证明的能力，标明缺哪一张对照图。"],"29":["湿地材质拆解＋自己的路面贴图","干路与湿路的材质对照","取湿路面案例里与粗糙度有关的笔记，再给自己的地面贴图和渲染器名称。","生成两套材质参数，锁定机位和光源，输出干湿对照并指出哪一项负责高光变化。"],"30":["模型三视角＋自己的资产资料","展示产品细节的镜头顺序","在可转动模型上记录三个有信息的视角，附自有模型、尺寸和希望展示的局部。","写转台运镜脚本，标明哪一秒展示接口、侧面与背面，并生成镜头预览图。"],"31":["前后对比与遮挡标注＋自有镜头","可逐层检查的合成方案","记录一条幕后特效中哪些区域保留实拍、哪些区域替换，附自己的实拍画面。","在自己的画面上给出遮罩、替换背景和接触阴影分区，列每层单独开关时的检查点。"],"32":["特效访谈＋实际拍摄条件","开拍前需采集的素材表","摘记访谈中现场定位与后期合成的衔接方式，提供自己的机位、镜头与合成目标。","列出底板、参考光、遮挡参考等适用素材，逐项说明漏拍会影响哪一步后期。"],"33":["开放电影布局帧＋自己的场景","同机位的三版灯光情绪图","提供可使用的场景或自有 Blender 文件，附开放电影的布局观察和三种情绪词。","让能运行 Blender 的 AI 固定镜头，分三版调主光、补光和色温，渲染三张对照。"],"34":["两张环境光贴图＋同一材质球","只换环境光的反射对比","选两张适用的 HDRI，附自有模型、同一金属材质和固定机位。","输出两张对照渲染，材质参数相同；比较高光的方向、宽度与暗面细节。"],"35":["地平线与尺度笔记＋自己的主题","同一场景三种尺度构图","从日更作品中记录地平线和人物相对主体的大小，另给自己的题 和反光变化。"],"107":["胶片着色样本＋自己的灰度镜头","明暗着色不同的两种复古风格","记录 Tinting 和 Toning 样本中亮部、暗部的颜色关系，再给自己的黑白画面。","做两版基于观察的调色实验，输出同帧对照及高光阴影取样，标注为当代模拟。"],"108":["可变字轴值＋自己的标题与栏宽","先增粗再收窄的标题动画","在方正悠黑样张记录 Weight 和 Width 的两组状态；提供自有文案、栏宽及许可可用的可变字体。","生成字重再字宽的动画，字号固定；在目标宽度检查最长标题是否仍在一行。"],"109":["字体检测结果＋自己拥有的字体","只使用已支持特性的排版样张","把字体检测结果中的轴名、范围和 OpenType 特性交给 AI，加上要排的文本。","输出合法范围的字体 CSS 与前后样张，逐项开关数字或替代字形，确认哪些真实生效。"],"110":["品牌色的明度色相与目标色域","有明度梯度的品牌色阶","从取色器记录品牌色的 OKLCH 值和目标屏幕色域，给需要的层级数量。","生成固定色相的色阶表，标出超出 sRGB 的项及回退色，并在相同背景下预览。"],"111":["场景配色方案＋自己的宣传素材","配色落到真实画面的品牌预览","在同一模型场景里选两套配色，提供它们的色值与自己的包装、网页或海报内容。","把两套色分别应用到相同版式，输出对照图，检查品牌色落在何处、标题能否辨认。"],"112":["馆藏原图条目＋原始权利说明","带来源的历史画面解说卡","从专题进入馆藏原页，给 AI 作品题名、年代、馆藏链接、权利标注与自己的解说主题。","生成一张历史画面解说卡，保留作者、年份、馆藏和原图链接，把作品事实与解读分开。"]}</script>

const el=id=>document.getElementById(id), make=(tag,cls,txt)=>{const node=document.createElement(tag);if(cls)node.className=cls;if(txt!=null)node.textContent=txt;return node};
const counts=(key)=>rows.reduce((acc,row)=>(acc[row[key]]=(acc[row[key]]||0)+1,acc),{});
const categories=counts('category'),sources=counts('collection'),cats=Object.keys(categories);
const colors=['#c36949','#7275ad','#578072','#c56c64','#807c4f','#ae6954','#517b83','#9370a1','#866a52'];
const norm=s=>s.toLocaleLowerCase().normalize('NFKC').trim();
const alternatives={缓动:['easings','easeout','速度曲线'],动效:['动态设计','动画','缓动','easings'],立体:['3d','三维'],色彩:['配色','颜色','色阶'],海报:['海报','招贴'],排字:['排版','字体']};
const text=rows.map(r=>norm([r.name,r.category,r.try_it,...guides[r.id],new URL(r.url).hostname].join(' ')));
let category='',source='';const catButtons=new Map(),sourceButtons=new Map();
function makeButton(container,label,callback){const b=make('button','',label);b.type='button';b.addEventListener('click',callback);container.appendChild(b);return b}
function chooseCat(val){category=val;el('mobileCat').value=val;render()}
function reset(){el('search').value='';source='';chooseCat('');el('search').focus()}
for(const [key,label,count] of [['','全部分类',rows.length],...cats.map(c=>[c,c,categories[c]])]){
 const b=makeButton(el('cats'),'',()=>chooseCat(key));b.append(make('span','',label),make('span','',String(count)));catButtons.set(key,b);
 const opt=make('option','',label+' ('+count+')');opt.value=key;el('mobileCat').appendChild(opt)}
for(const [key,label] of [['','全部来源'],['原帖','原帖收录'],['补充','另行补充']]){
 const b=makeButton(el('sources'),label,()=>{source=key;render()});sourceButtons.set(key,b)}
el('source').href=catalog.source_post;el('original').textContent=sources['原帖'];el('additional').textContent=sources['补充'];el('updated').textContent='整理日期 '+catalog.updated.replaceAll('-','.');
el('search').addEventListener('input',render);el('mobileCat').addEventListener('change',e=>chooseCat(e.target.value));
function render(){
 for(const [key,b] of catButtons)b.setAttribute('aria-pressed',String(category===key));for(const [key,b] of sourceButtons)b.setAttribute('aria-pressed',String(source===key));
 const terms=norm(el('search').value).split(/\s+/).filter(Boolean);
 const matches=rows.filter((r,i)=>(!source||r.collection===source)&&(!category||r.category===category)&&terms.every(word=>[word,...(alternatives[word]||[])].some(k=>text[i].includes(k))));
 el('count').textContent=matches.length+' / '+rows.length+' 个站点';
 const frag=document.createDocumentFragment();
 for(const r of matches){
  const [shortInput,shortResult,input,result]=guides[r.id];
  const card=make('article','card');
  card.style.setProperty('--accent',colors[cats.indexOf(r.category)%colors.length]);
  const meta=make('div','meta');
  meta.append(make('span','',r.category),make('span','idx',r.collection+' '+String(r.id).padStart(3,'0')));
  const openSite=(className,label)=>{const link=make('a',className,label);link.href=r.url;link.target='_blank';link.rel='noopener noreferrer';return link};
  const heading=make('h3');heading.append(openSite('card-title',r.name));
  const pair=make('dl','ai-pair');pair.append(make('dt','','给 AI'),make('dd','',shortInput),make('dt','','得到'),make('dd','',shortResult));
  const more=make('details','instructions');more.append(make('summary','','展开做法与验收'));
  for(const [label,content] of [['准备材料',input],['交付与验收',result],['站内练习',r.try_it]]){
   const paragraph=make('p');paragraph.append(make('strong','',label+'　'),document.createTextNode(content));more.append(paragraph);
  }
  const visit=openSite('visit');visit.setAttribute('aria-label','打开 '+r.name+' 官网');
  visit.append(make('span','domain',new URL(r.url).hostname.replace(/^www\./,'')),make('span','arrow','↗'));
  card.append(meta,heading,pair,more,visit);frag.append(card)
 }
 if(!matches.length){const msg=make('div','empty');msg.append(make('strong','','没有找到符合条件的站点。'));makeButton(msg,'清除筛选',reset);frag.append(msg)}
 el('results').replaceChildren(frag)}
render();
</script></body></html>
